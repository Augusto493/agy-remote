plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agyremote.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.agyremote.app'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assina com a chave de debug para instalar direto no celular (uso pessoal).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
